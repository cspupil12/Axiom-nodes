# Nginx Configuration for Axiom Solutions Applications Portal (apply.axiomsolutions.site / apply.axiomsolution.site)
# Copy this file to: /etc/nginx/sites-available/apply.axiomsolutions.site
# Then enable it: ln -sf /etc/nginx/sites-available/apply.axiomsolutions.site /etc/nginx/sites-enabled/
# Test config: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name apply.axiomsolutions.site apply.axiomsolution.site www.apply.axiomsolutions.site;

    # Root folder pointing to the pre-built dist/ of apply-portal
    root /var/www/apply.axiomsolutions.site/dist;
    index index.html;

    # Gzip Compression for Fast Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets (JS, CSS, Images, Fonts) - 1 year immutable cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # React Single Page App (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
